<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloseAuth</title>
  <script>
    // §3.8: resolved before first paint, ahead of the module script — a
    // white flash on a dark console reads as a bug even when everything
    // else is right, and on the hosted login page it's the first thing a
    // tenant's users ever see. Mirrors stores/theme.ts's own resolution
    // logic (mode -> resolved); that store takes over once Vue mounts.
    (function () {
      try {
        var s = localStorage.getItem('closeauth.theme') || 'system';
        var d = s === 'dark' || (s === 'system' &&
          matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
