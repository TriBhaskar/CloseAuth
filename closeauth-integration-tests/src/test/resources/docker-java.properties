# docker-java default config, read from the classpath by DefaultDockerClientConfig (Testcontainers uses it).
#
# Docker Engine 29 dropped API versions below 1.40; the docker-java bundled with Testcontainers otherwise defaults to
# 1.32, so every call 400s ("client version 1.32 is too old. Minimum supported API version is 1.40"). Pinning a version
# inside the daemon's supported range makes all docker-java calls (ping, image pull, build, run) negotiate correctly.
# 1.44 (Docker 25-era) is broadly supported; bump if a future daemon raises its minimum above it.
api.version=1.44
